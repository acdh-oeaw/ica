name: Validate

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-validate"
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate visual snapshots on the CI runner and upload them as an artifact"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: true
      matrix:
        node-version: [26.x]
        os: [ubuntu-26.04]

    env:
      NEXT_PUBLIC_API_BASE_URL: "${{ vars.NEXT_PUBLIC_API_BASE_URL }}"
      NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_MATOMO_BASE_URL: "${{ vars.NEXT_PUBLIC_MATOMO_BASE_URL }}"
      NEXT_PUBLIC_REDMINE_ID: "${{ vars.SERVICE_ID }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run types:check

      - name: Get playwright version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --json | jq --raw-output '.[0].devDependencies["@playwright/test"].version')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Cache playwright browsers
        uses: actions/cache@v6
        id: cache-playwright-browsers
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ matrix.os }}-playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}"

      - name: Install playwright browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
      - name: Install playwright browsers (operating system dependencies)
        if: steps.cache-playwright-browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      # https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching#github-actions
      - name: Cache Next.js build output
        uses: actions/cache@v6
        with:
          path: "${{ github.workspace }}/.next/cache"
          key: "${{ matrix.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}"

      - name: Build app
        run: pnpm run build

      - name: Run e2e tests
        if: ${{ !inputs.update-snapshots }}
        run: xvfb-run --auto-servernum pnpm run test:e2e --pass-with-no-tests

      - name: Update visual snapshots
        if: ${{ inputs.update-snapshots }}
        run: xvfb-run --auto-servernum pnpm run test:e2e:update-snapshots

      - name: Upload visual snapshots
        uses: actions/upload-artifact@v7
        if: ${{ inputs.update-snapshots }}
        with:
          name: snapshots
          path: e2e/snapshots/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build-deploy:
    name: Build and deploy
    if: ${{ github.event_name == 'push' }}
    needs: [validate]
    uses: ./.github/workflows/build-deploy.yaml
    secrets: inherit
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#access-and-permissions
    permissions:
      contents: read
      packages: write
